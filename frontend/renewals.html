<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RenewOps – Upcoming Renewals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="/static/css/app.css" rel="stylesheet"/>
</head>
<body>

<div id="sidebar"></div>
<div id="main">
  <div id="topbar">
    <div>
      <h5 class="mb-0 fw-700">Upcoming Renewals</h5>
      <small class="text-muted">Track and manage renewal timelines</small>
    </div>
    <div class="d-flex gap-2">
      <select id="daysFilter" class="form-select form-select-sm" style="width:140px" onchange="loadRenewals()">
        <option value="7">Next 7 days</option>
        <option value="30" selected>Next 30 days</option>
        <option value="60">Next 60 days</option>
        <option value="90">Next 90 days</option>
        <option value="180">Next 6 months</option>
        <option value="365">Next 1 year</option>
      </select>
    </div>
  </div>

  <div class="page-content">

    <!-- Overdue banner -->
    <div id="overdue-section" class="mb-3" style="display:none">
      <div class="table-card border border-danger">
        <div class="card-header text-danger d-flex align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i> Overdue Renewals
        </div>
        <table class="table mb-0">
          <thead><tr><th>Subscription</th><th>Vendor</th><th>Renewal Date</th><th>Days Overdue</th><th>Owner</th><th>Decision</th><th>Risk</th><th>Action</th></tr></thead>
          <tbody id="overdue-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Upcoming -->
    <div class="table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Upcoming Renewals (<span id="upcoming-count">0</span>)</span>
      </div>
      <table class="table mb-0">
        <thead><tr><th>Subscription</th><th>Vendor</th><th>Dept</th><th>Amount</th><th>Renewal Date</th><th>Days Left</th><th>Auto-Renew</th><th>Decision</th><th>Risk</th><th>Action</th></tr></thead>
        <tbody id="upcoming-body">
          <tr><td colspan="10" class="text-center text-muted py-5">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Decision Modal -->
<div class="modal fade" id="decisionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Renewal Decision</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-3">Subscription: <strong id="decisionSubName"></strong></p>
        <div class="mb-3">
          <label class="form-label">Decision</label>
          <select id="decisionSelect" class="form-select">
            <option>Undecided</option>
            <option>Renew</option>
            <option>Cancel</option>
            <option>Under Review</option>
          </select>
        </div>
        <div>
          <label class="form-label">Notes (optional)</label>
          <textarea id="decisionNotes" class="form-control" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitDecision()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
<script>
let decisionSubId = null;
const decisionModal = new bootstrap.Modal(document.getElementById('decisionModal'));

function toMonthly(a, c) {
  if (c === 'Quarterly') return a / 3; if (c === 'Yearly') return a / 12; return a;
}

function renewalRow(s, overdue = false) {
  const days = daysUntil(s.renewal_date);
  return `<tr>
    <td class="fw-600">${s.name}</td>
    <td class="text-muted">${s.vendor}</td>
    <td>${s.department || '—'}</td>
    <td>${formatCurrency(toMonthly(s.amount, s.billing_cycle), s.currency)}/mo</td>
    <td>${formatDate(s.renewal_date)}</td>
    <td>${daysUntilLabel(s.renewal_date)}</td>
    <td>${s.auto_renewal ? '<span class="badge bg-warning-subtle text-warning">Yes</span>' : '<span class="badge bg-light text-muted">No</span>'}</td>
    <td>${decisionBadge(s.renewal_decision)}</td>
    <td>${riskBadge(s.risk)}</td>
    <td><button class="btn btn-xs btn-outline-primary py-0 px-1" onclick="openDecision('${s.id}','${s.name.replace(/'/g,"\\'")}','${s.renewal_decision}')"><i class="bi bi-pencil"></i></button></td>
  </tr>`;
}

async function loadRenewals() {
  const days = document.getElementById('daysFilter').value;
  try {
    const [upcoming, overdue] = await Promise.all([
      api.get(`/renewals/upcoming?days=${days}`),
      api.get('/renewals/overdue'),
    ]);
    document.getElementById('upcoming-count').textContent = upcoming.length;
    const ubody = document.getElementById('upcoming-body');
    ubody.innerHTML = upcoming.length
      ? upcoming.map(s => renewalRow(s)).join('')
      : '<tr><td colspan="10" class="text-center text-muted py-5">No renewals in this period. 🎉</td></tr>';

    const osec = document.getElementById('overdue-section');
    if (overdue.length) {
      osec.style.display = '';
      document.getElementById('overdue-body').innerHTML = overdue.map(s => renewalRow(s, true)).join('');
    } else {
      osec.style.display = 'none';
    }
  } catch (e) {
    showToast('Error: ' + e.message, 'danger');
  }
}

function openDecision(id, name, currentDecision) {
  decisionSubId = id;
  document.getElementById('decisionSubName').textContent = name;
  document.getElementById('decisionSelect').value = currentDecision;
  document.getElementById('decisionNotes').value = '';
  decisionModal.show();
}

async function submitDecision() {
  try {
    await api.patch(`/subscriptions/${decisionSubId}/decision`, {
      decision: document.getElementById('decisionSelect').value,
      changed_by: 'Dashboard',
      notes: document.getElementById('decisionNotes').value || null,
    });
    decisionModal.hide();
    showToast('Decision updated!', 'success');
    loadRenewals();
  } catch (e) { showToast('Error: ' + e.message, 'danger'); }
}

loadRenewals();
</script>
</body>
</html>
